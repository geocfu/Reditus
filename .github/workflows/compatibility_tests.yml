name: Compatibility Tests

on:
  pull_request:

jobs:
  test:
    name: Compatibility tests
    # Windows, because the net4x targets need .NET Framework.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            2.0.x
            2.1.x
            2.2.x
            3.0.x
            3.1.x
            5.0.x
            6.0.x
            7.0.x
            8.0.x
            9.0.x
            10.0.x

      - name: Test
        run: dotnet test tests/Reditus.CompatibilityTests --configuration Release
