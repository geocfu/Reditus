name: Unit Tests

on:
  pull_request:
    branches:
      - main
      - develop

jobs:
  test:
    name: Unit Tests    
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.x.x'

      - name: Test
        # Fails the run if line, branch or method coverage of the library drops below 100%.
        run: dotnet test tests/Reditus.UnitTests/Reditus.UnitTests.csproj --configuration Release /p:CollectCoverage=true /p:Threshold=100
